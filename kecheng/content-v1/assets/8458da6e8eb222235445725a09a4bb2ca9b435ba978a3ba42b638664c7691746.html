  <script>(() => {
  const books = {
    'minna-shokyu-1': ['初级1', 1, 25],
    'minna-shokyu-2': ['初级2', 26, 50],
    'minna-chukyu-1': ['中级1', 1, 12],
    'minna-chukyu-2': ['中级2', 13, 24],
    'standard-shokyu-1': ['新标准初级上', 1, 24],
    'standard-shokyu-2': ['新标准初级下', 25, 48],
    'standard-chukyu-1': ['新标准中级上', 1, 16],
    'standard-chukyu-2': ['新标准中级下', 17, 32],
    'standard-jokyu-1': ['新标准高级上', 1, 12],
    'standard-jokyu-2': ['新标准高级下', 13, 24]
  };
  const materialLabels = { main: '正文', studyGuide: '学习辅导', answers: '解答', textbookVocabulary: '词汇', grammar: '文法', conversation: '会话' };
  const continueAction = document.querySelector('[data-continue-action]');
  const selectAction = document.querySelector('[data-select-action]');
  if (!continueAction || !selectAction) return;
  const parse = (value) => { try { return value ? JSON.parse(value) : null; } catch { return null; } };
  const read = (suffix) => localStorage.getItem('minna-reader:v2:' + suffix) ?? localStorage.getItem('minna-reader:v1:' + suffix);
  const storedLocation = parse(read('last-location'));
  const book = storedLocation ? books[storedLocation.bookId] : null;
  const lessonMatch = storedLocation?.lessonId?.match(/^lesson-(\d{2})$/);
  const lessonNumber = lessonMatch ? Number(lessonMatch[1]) : 0;
  if (!book || lessonNumber < book[1] || lessonNumber > book[2]) return;
  const bookId = storedLocation.bookId;
  const lessonId = storedLocation.lessonId;
  const pane = parse(read('pane:' + bookId + ':' + lessonId + ':left')) ?? {};
  const materialLabel = materialLabels[pane.materialKey] ?? '正文';
  const page = Math.max(1, Number(pane.pageIndex ?? 0) + 1);
  continueAction.href = '/reader/?book=' + encodeURIComponent(bookId) + '&lesson=' + encodeURIComponent(lessonId);
  continueAction.dataset.analyticsBook = bookId;
  continueAction.dataset.analyticsLesson = lessonId;
  continueAction.querySelector('[data-progress-meta]').textContent = book[0] + ' · 第' + String(lessonNumber).padStart(2, '0') + '课 · ' + materialLabel + '第' + page + '页';
  continueAction.hidden = false;
  selectAction.classList.remove('primary');
  selectAction.classList.add('secondary');
})();</script>
